<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="lens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- App Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="128" fill="#0A0A0A" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" />
  
  <!-- Video Camera Icon Representation -->
  <g filter="url(#shadow)" transform="translate(100, 130)">
    <!-- Main Camera Body -->
    <rect x="0" y="20" width="210" height="210" rx="44" fill="#FFFFFF" />
    
    <!-- Camera Lens / Iris Circle -->
    <circle cx="105" cy="125" r="54" fill="url(#lens-grad)" />
    <circle cx="105" cy="125" r="30" fill="#1E3A8A" />
    <circle cx="95" cy="115" r="10" fill="#FFFFFF" opacity="0.8" />
    
    <!-- Live Pulse Dot -->
    <circle cx="170" cy="55" r="14" fill="#EF4444" />
    <circle cx="170" cy="55" r="22" fill="#EF4444" opacity="0.35" />
    
    <!-- Projection Triangle / Side Lens -->
    <path d="M 230 75 L 312 25 C 322 18 332 26 332 38 L 332 212 C 332 224 322 232 312 225 L 230 175 Z" fill="#FFFFFF" />
  </g>
  
  <!-- Audio wave pulse bar accents at bottom -->
  <g fill="#93C5FD" opacity="0.9" transform="translate(156, 400)">
    <rect x="0" y="10" width="16" height="28" rx="8" />
    <rect x="26" y="0" width="16" height="48" rx="8" fill="#FFFFFF" />
    <rect x="52" y="14" width="16" height="20" rx="8" />
    <rect x="78" y="4" width="16" height="40" rx="8" fill="#FFFFFF" />
    <rect x="104" y="12" width="16" height="24" rx="8" />
    <rect x="130" y="2" width="16" height="44" rx="8" fill="#FFFFFF" />
    <rect x="156" y="10" width="16" height="28" rx="8" />
    <rect x="182" y="16" width="16" height="16" rx="8" />
  </g>
</svg>
